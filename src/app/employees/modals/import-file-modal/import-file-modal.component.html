



<!-- Main modal -->
<div id="import-file-modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%)] max-h-full bg-black/25 backdrop-blur-md">
  <div class="relative p-4 w-full max-w-md lg:max-w-lg max-h-full">
      <!-- Modal content -->
      <div class="relative bg-white rounded-lg shadow-sm">
          <!-- Modal header -->
          <div class="relative flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
              <h3 class="w-full text-center text-lg lg:text-xl font-semibold text-gray-900">
                  Importar archivo CSV
              </h3>
              <button type="button" class="absolute top-5 right-5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-primary rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="import-file-modal">
                  <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                  </svg>
                  <span class="sr-only">Close modal</span>
              </button>
          </div>
          <!-- Modal body -->
          <div class="p-4 md:p-5 space-y-4">
            <svg class="size-10 mb-4 text-gray-500 mx-auto" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
            </svg>
            <p class="mt-1 text-sm text-gray-500" id="file_input_help">Importa empleados con un archivo CSV</p>
            <label class="block mb-2 text-sm font-medium text-gray-900" for="file_input">Cargar archivo</label>
            <input class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none" aria-describedby="file_input_help" id="file_input" type="file">
            <p class="mt-1 text-sm text-gray-500" id="file_input_help">Puedes usar el template para archivos CSV.</p>
            <a class="text-sm cursor-pointer text-primary hover:underline font-medium">Descárgalo aquí.</a>
          </div>
          <!-- Modal footer -->
          <div class="justify-center flex items-center gap-4 p-4 md:p-5 border-t border-gray-200 rounded-b">
            <!--//////////-->
            <!--Primary Button Start-->
            <button data-modal-hide="import-file-modal" type="button"class="text-white bg-primary hover:bg-opacity-90 focus:ring-4 focus:ring-primary focus:ring-opacity-30 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none">
              Importar
            </button>
            <!--Primary Button End-->  
            <!--//////////-->
            <!--Tertiary Button Start-->
            <button data-modal-hide="import-file-modal" type="button" class="py-2.5 px-5 text-sm !font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-primary focus:z-10 focus:ring-4 focus:ring-gray-100">
              Cancelar
            </button>
            <!--Tertiary Button End-->
            <!--//////////-->
          </div>
      </div>
  </div>
</div>
