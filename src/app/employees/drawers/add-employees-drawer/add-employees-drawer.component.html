  <!--//////////-->
  <!--Drawer Start-->
  <div id="drawer-right-add-employees" class="fixed top-0 right-0 z-40 h-screen overflow-y-auto transition-transform translate-x-full bg-white w-80 md:w-[400px] xl:w-[500px]" tabindex="-1" aria-labelledby="drawer-right-label">
    <!--//////////-->
    <!--Header Start-->
    <div class="flex gap-4 justify-between p-4 md:p-5 border-b border-b-gray-200">
        <h3 class="text-lg lg:text-xl font-semibold text-gray-900 pt-0.5">
          Agregar empleado
        </h3>
        <button type="button" data-drawer-hide="drawer-right-add-employees" aria-controls="drawer-right-add-employees" class="text-gray-700 bg-gray-100 hover:bg-gray-200 hover:text-primary rounded-lg text-sm w-8 h-8 inline-flex items-center justify-center" >
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
            <span class="sr-only">Close menu</span>
        </button>
    </div>
    <!--Header End-->
    <!--//////////-->
    <!--Body Start-->
    <div class="flex flex-col gap-4 p-4 md:p-5">
        <!--//////////-->
        <!--Input Tyoe Text Start-->
        <div>
            <label for="input-name" class="block mb-2 text-sm font-medium text-gray-900">Nombre completo</label>
            <input placeholder="Ingresar..." type="text" id="input-name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5">
        </div>
        <!--Input Type Text End-->
        <!--//////////-->
        <!--Input Tyoe Text Start-->
        <div>
            <label for="input-email" class="block mb-2 text-sm font-medium text-gray-900">Correo electrónico</label>
            <input placeholder="email@originsw.com" type="email" id="input-email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5">
        </div>
        <!--Input Type Text End-->
        <!--//////////-->
        <!--Input Tyoe Text Start-->
        <div>
            <label for="input-number" class="block mb-2 text-sm font-medium text-gray-900">N° Legajo</label>
            <input placeholder="Ingresar..." type="number" id="input-number" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5">
        </div>
        <!--Input Type Text End-->
        <!--//////////-->
        <!--Select Start-->
        <div>
          <label for="options" class="block mb-2 text-sm font-medium text-gray-900">Sucursal</label>
          <select
            id="options"
            [(ngModel)]="selectedOption"
            class="bg-gray-50 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5 !text-gray-700 !text-sm !font-normal">
            <option class="!text-gray-700 !text-sm !font-normal" value="" disabled hidden>Seleccionar...</option>
            <option class="!text-gray-700 !text-sm !font-normal" *ngFor="let option of options" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </div>
        <!--Select End-->
           <!--//////////-->
        <!--Datepickert Start-->
        <div>
          <label for="datepicker" class="block mb-2 text-sm font-medium text-gray-900">Fecha de ingreso</label>
          <div class="relative">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
              <svg class="w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
              </svg>
            </div>
            <input id="datepicker" name="date" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full ps-10 p-2.5" placeholder="Seleccioná una fecha">
          </div>
        </div>
        <!--Datepickert End-->
        <!--//////////-->
        <!--File Input Start-->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900" for="file_input">Foto perfil</label>
          <input class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none" aria-describedby="file_input_help" id="file_input" type="file">
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-300" id="file_input_help">Formato PNG o JPG (peso máximo: 400x400px).</p>
        </div>
        <!--File Input End-->
        <!--//////////-->
    </div>
    <!--Body End-->
    <!--//////////-->
    <!--Footer Start-->
    <div class="flex items-center gap-4 p-4 md:p-5 border-t border-gray-200 rounded-b">
         <!--//////////-->
        <!--Primary Button Start-->
        <button data-drawer-hide="drawer-right-add-employees" aria-controls="drawer-right-add-employees" class="text-white bg-primary hover:bg-opacity-90 focus:ring-4 focus:ring-primary focus:ring-opacity-30 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none">
            Agregar
        </button>
        <!--Primary Button End-->  
        <!--//////////-->
        <!--Tertiary Button Start-->
        <button data-drawer-hide="drawer-right-add-employees" aria-controls="drawer-right-add-employees" class="py-2.5 px-5 text-sm !font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-primary focus:z-10 focus:ring-4 focus:ring-gray-100">
            Cancelar
        </button>
        <!--Tertiary Button End-->
        <!--//////////-->
    </div>
    <!--Footer End-->
    <!--//////////-->
  </div>
  <!--Drawer End-->
  <!--//////////-->
