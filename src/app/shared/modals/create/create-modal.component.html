<!-- Main modal -->
<div id="create-modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%)] max-h-full bg-black/25 backdrop-blur-md">
    <div class="relative p-4 w-full max-w-2xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow-sm">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
                <h3 class="text-lg lg:text-xl font-semibold text-gray-900">
                    Crear...
                </h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-primary rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="create-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <div class="p-4 md:p-5 min-h-10 flex flex-row flex-nowrap gap-4">
              <!--Image Drop Container Start-->
              <div class="flex flex-col gap-1">
                <label class="block mb-1 text-sm font-medium text-gray-900">Imagen</label>
                <label for="dropzone-file" class="flex flex-col items-center justify-center min-w-48 max-w-48 min-h-48 max-h-48  border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                  <div class="flex flex-col items-center justify-center p-4">
                      <svg class="w-8 h-8 mb-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                      </svg>
                      <p class="text-center max-w-xs mb-2 text-sm text-gray-500"><span class="mr-1.5 font-semibold">Cargar archivo</span>no superior a los 200kb</p>
                      <p class="text-center max-w-xs text-xs text-gray-500">Únicamente se pueden importar archivos en formatos <span class="mr-1.5 font-semibold">.jpg .png</span></p>
                  </div>
                  <input id="dropzone-file" type="file" class="hidden" />
                </label>
              </div>
              <!--Image Drop Container End-->
              <!--//////////-->
              <!--Info Container Start-->
              <div class="flex flex-col w-full gap-4">
                <div class="flex flex-nowrap gap-4">
                  <div class="w-full">
                    <label for="default-input" class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
                    <input placeholder="Seleccionar..." type="text" id="default-input" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5">
                  </div>
                  <div class="w-full">
                    <label for="default-input" class="block mb-2 text-sm font-medium text-gray-900">Precio</label>
                    <input placeholder="Seleccionar..." type="text" id="default-input" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5">
                  </div>
                </div>
                <div>
                  <label for="message" class="block mb-2 text-sm font-medium text-gray-900">Descripción</label>
                  <textarea id="message" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary focus:border-primary" placeholder="Describe aquí algún detalle que consideres necesario..."></textarea>
                </div>
              </div>
              <!--Info Container End-->
              <!--//////////-->
            </div>
            <!-- Modal footer -->
            <div class="flex items-center gap-4 p-4 md:p-5 border-t border-gray-200 rounded-b">
              <!--//////////-->
              <!--Primary Button Start-->
              <button data-modal-hide="create-modal" type="button"class="text-white bg-primary hover:bg-opacity-90 focus:ring-4 focus:ring-primary focus:ring-opacity-30 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none">
                Crear
              </button>
              <!--Primary Button End-->  
              <!--//////////-->
              <!--Tertiary Button Start-->
              <button data-modal-hide="create-modal" type="button" class="py-2.5 px-5 text-sm !font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-primary focus:z-10 focus:ring-4 focus:ring-gray-100">
                Cancelar
              </button>
              <!--Tertiary Button End-->
              <!--//////////-->
            </div>
        </div>
    </div>
</div>
