<!--Filter Start-->
<div id="accordion-color" data-accordion="collapse" class="mb-4 bg-opacity-100 rounded-lg bg-white shadow" data-active-classes="text-primary rounded-t-lg rounded-b-none">
  <!--//////////-->
  <!--Filter Header Start-->
  <h2 id="accordion-color-heading-1">
    <button type="button" class="group flex items-center justify-between w-full p-5 font-medium rtl:text-right text-gray-900 hover:text-primary rounded-lg gap-3 bg-white hover:bg-gray-50 border border-gray-200 hover:border-gray-300" data-accordion-target="#accordion-color-body-1" aria-expanded="true" aria-controls="accordion-color-body-1">
      <span class="flex gap-2 flex-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 24" class="size-6 fill-none">
          <path class="fill-current hover:fill-primary" d="M14.4971 21C14.2822 21 14.0732 20.9317 13.9013 20.8054L9.90702 17.8865C9.78368 17.7959 9.68357 17.6783 9.61463 17.5432C9.54568 17.4081 9.50978 17.2592 9.50978 17.1081V13.5373L3.88984 6.10378C3.67102 5.81419 3.53856 5.47075 3.50722 5.11175C3.47589 4.75274 3.54691 4.39226 3.71237 4.07047C3.87783 3.74867 4.13123 3.47821 4.44434 3.28921C4.75745 3.1002 5.11798 3.00008 5.48575 3H19.5143C19.882 3.00008 20.2425 3.1002 20.5557 3.28921C20.8688 3.47821 21.1222 3.74867 21.2876 4.07047C21.4531 4.39226 21.5241 4.75274 21.4928 5.11175C21.4614 5.47075 21.329 5.81419 21.1102 6.10378L15.4902 13.5373V20.027C15.4902 20.2851 15.3856 20.5326 15.1993 20.715C15.0131 20.8975 14.7605 21 14.4971 21ZM11.496 16.6216L13.504 18.0879V13.2162C13.504 13.0057 13.5737 12.8008 13.7026 12.6324L19.5143 4.94595H5.48575L11.3013 12.6324C11.4303 12.8008 11.5 13.0057 11.5 13.2162L11.496 16.6216Z"/>
        </svg>
        <span class="text-sm font-semibold pt-0.5 leading-normal">
          Filtros
        </span>
      </span>
      <svg data-accordion-icon class="w-3 h-3 rotate-180 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5 5 1 1 5"/>
      </svg>
    </button>
  </h2>
  <!--Filter Header End-->
  <!--//////////-->
  <!--Filter Container Inner Start-->
  <div id="accordion-color-body-1" class="hidden border border-gray-200 border-t-0 rounded-b-lg" aria-labelledby="accordion-color-heading-1">
    <div class="w-full p-5">
    <!--Filter Body Start-->
      <!--//////////-->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-4">
        <!--//////////-->
        <!--Input Tyoe Text Start-->
        <div>
          <label for="default-input" class="block mb-2 text-sm font-medium text-gray-900">Empleado</label>
          <input placeholder="Ingresar..." type="text" id="default-input" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5">
        </div>
        <!--Input Type Text End-->
        <!--//////////-->
        <!--Select Start-->
        <div>
          <label for="options" class="block mb-2 text-sm font-medium text-gray-900">Sucursal</label> 
          <select
            id="options"
            [(ngModel)]="selectedOption"
            class="bg-gray-50 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5 !text-gray-700 !text-sm !font-normal">
            <option class="!text-gray-700 !text-sm !font-normal" value="" disabled hidden>Seleccionar...</option>
            <option class="!text-gray-700 !text-sm !font-normal" *ngFor="let option of options" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </div>
        <!--Select End-->
        <!--//////////-->
        <!--Input Tyoe Text Start-->
        <div>
          <label for="default-input" class="block mb-2 text-sm font-medium text-gray-900">N° pedido</label>
          <input placeholder="Ingresar..." type="number" id="default-input" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5">
        </div>
        <!--Input Type Text End-->
        <!--//////////-->
        <!--Select Start-->
        <div>
          <label for="options02" class="block mb-2 text-sm font-medium text-gray-900">Lote</label>
          <select
            id="options02"
            [(ngModel)]="selectedOption02"
            class="bg-gray-50 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary block w-full p-2.5 !text-gray-700 !text-sm !font-normal">
            <option class="!text-gray-700 !text-sm !font-normal" value="" disabled hidden>Seleccionar...</option>
            <option class="!text-gray-700 !text-sm !font-normal" *ngFor="let option02 of options02" [value]="option02.value">
              {{ option02.label }}
            </option>
          </select>
        </div>
        <!--Select End-->
        <!--//////////-->
        <!--Datepickert Start-->
        <div>
          <label for="date-range-picker" class="block mb-2 text-sm font-medium text-gray-900">Fecha</label>
          <div id="date-range-picker" class="flex items-center gap-4">
            <!-- Input desde -->
            <div class="w-full relative">
              <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                </svg>
              </div>
              <input id="datepicker-range-start" name="start" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full ps-10 p-2.5" placeholder="Desde..." >
            </div>
            <!-- Input hasta -->
            <div class="w-full relative">
              <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                </svg>
              </div>
              <input id="datepicker-range-end" name="end" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary focus:border-primary block w-full ps-10 p-2.5" placeholder="Hasta...">
            </div>
          </div>
        </div>
        <!--Datepickert End-->
        <!--//////////-->
      </div>
      <!--Filter Body End-->
      <!--//////////-->
      <!--Filter Footer Start-->
      <div class="flex flex-row gap-4 flex-wrap">
        <!--Tertiary Button Start-->
        <button type="button" class="py-2.5 px-5 text-sm !font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-primary focus:z-10 focus:ring-4 focus:ring-gray-100">
          Limpiar
        </button>
        <!--Tertiary Button End-->
        <!--//////////-->
        <!--Secondary Button Start-->
        <button type="button"class="items-center text-primary hover:text-white bg-transparent hover:bg-primary focus:ring-4 focus:ring-primary focus:ring-opacity-30 !font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none border border-primary">
          Aplicar
        </button>
        <!--Secondary Button End-->
      </div>
      <!--Filter Footer End-->
    </div>
  </div>
  <!--Filter Container Inner End-->
   <!--//////////-->
</div>
<!--Filter End-->

  [titlesList]="titlesList"
